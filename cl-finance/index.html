<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CL Finance — демо</title><style>body{font:16px system-ui;background:#f3f6fb;color:#1a2c45;margin:0}main{max-width:900px;margin:auto;padding:20px}h1{margin-bottom:4px}.note{background:#fff1cf;padding:13px;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:15px 0}.card,section{background:white;padding:18px;border-radius:14px;border:1px solid #dfe6ef}.big{font-size:26px;font-weight:bold;margin-top:8px}button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #bdc9d8}button{background:#235cdb;color:white;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}nav button{background:white;color:#235cdb}nav button.active{background:#235cdb;color:white}label{display:grid;gap:5px;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #eee}section{overflow:auto}small{color:#667} @media(max-width:500px){.big{font-size:21px}}</style><main><h1>CL Finance</h1><small>Учёт доходности посуточной аренды · демонстрация</small><p class="note"><b>Тестовая версия.</b> Используйте только вымышленные данные. Сведения сохраняются локально в браузере iPhone и могут пропасть при очистке данных Safari. Серверной базы пока нет.</p><label>Объект <select id="property"></select></label><button id="add">+ Добавить объект</button><nav><button data-tab="overview" class="active">Обзор</button><button data-tab="bookings">Брони</button><button data-tab="expenses">Расходы</button><button data-tab="forecast">Прогноз</button></nav><div id="content"></div><p><button id="export">Скачать резервную копию JSON</button></p></main><script>
const key='cl_finance_safe_demo_v1',seed=()=>({properties:[{id:'demo1',name:'Демо-квартира №1'}],bookings:[{id:'b1',propertyId:'demo1',start:'2026-11-01',end:'2026-11-04',rate:4500,commission:20}],expenses:[{id:'e1',propertyId:'demo1',date:'2026-11-05',name:'Уборка',amount:1800}],forecast:{occupancy:75,rate:4800,commission:20,expenses:12000}});
let data;try{data=JSON.parse(localStorage.getItem(key))||seed()}catch{data=seed()}let chosen=data.properties[0].id,tab='overview';const el=id=>document.getElementById(id),money=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),nights=b=>Math.max(0,(new Date(b.end)-new Date(b.start))/86400000),book=()=>data.bookings.filter(b=>b.propertyId===chosen),exp=()=>data.expenses.filter(e=>e.propertyId===chosen),gross=()=>book().reduce((s,b)=>s+nights(b)*b.rate,0),net=()=>book().reduce((s,b)=>s+nights(b)*b.rate*(1-b.commission/100),0),cost=()=>exp().reduce((s,e)=>s+e.amount,0),card=(a,b)=>'<div class="card"><small>'+a+'</small><div class="big">'+b+'</div></div>';function save(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){el('property').innerHTML=data.properties.map(p=>'<option value="'+safe(p.id)+'" '+(p.id===chosen?'selected':'')+'>'+safe(p.name)+'</option>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';
if(tab==='overview')out='<div class="cards">'+card('Выручка до комиссий',money(gross()))+card('После комиссий',money(net()))+card('Расходы',money(cost()))+card('Результат без учёта налогов',money(net()-cost()))+'</div><section><h3>Показатели</h3><p>Бронирований: '+book().length+' · Ночей: '+book().reduce((s,b)=>s+nights(b),0)+'</p></section>';
if(tab==='bookings')out='<section><h3>Бронирования</h3><table><tr><th>Заезд</th><th>Выезд</th><th>Цена/ночь</th><th></th></tr>'+book().map(b=>'<tr><td>'+safe(b.start)+'</td><td>'+safe(b.end)+'</td><td>'+money(b.rate)+'</td><td><button data-delb="'+b.id+'">×</button></td></tr>').join('')+'</table><h3>Новая бронь</h3><form id="booking"><label>Заезд<input name="start" type="date" required></label><label>Выезд<input name="end" type="date" required></label><label>Цена за ночь, ₽<input name="rate" type="number" min="0" required></label><label>Комиссия, %<input name="commission" type="number" min="0" max="100" value="20" required></label><button>Добавить</button></form></section>';
if(tab==='expenses')out='<section><h3>Расходы</h3><table><tr><th>Дата</th><th>Статья</th><th>Сумма</th><th></th></tr>'+exp().map(e=>'<tr><td>'+safe(e.date)+'</td><td>'+safe(e.name)+'</td><td>'+money(e.amount)+'</td><td><button data-dele="'+e.id+'">×</button></td></tr>').join('')+'</table><h3>Новый расход</h3><form id="expense"><label>Дата<input name="date" type="date" required></label><label>Статья<input name="name" maxlength="80" required></label><label>Сумма, ₽<input name="amount" type="number" min="0" required></label><button>Добавить</button></form></section>';
if(tab==='forecast'){let s=data.forecast,r=30*s.occupancy/100*s.rate*(1-s.commission/100);out='<section><h3>Прогноз на 30 дней</h3>'+[['occupancy','Загрузка, %'],['rate','Цена ночи, ₽'],['commission','Комиссия, %'],['expenses','Расходы, ₽']].map(([k,label])=>'<label>'+label+'<input type="number" data-f="'+k+'" min="0" value="'+s[k]+'"></label>').join('')+'<div class="cards">'+card('Выручка после комиссий',money(r))+card('Результат',money(r-s.expenses))+'</div><small>Упрощённая модель, без налогов.</small></section>'}
el('content').innerHTML=out;let f=el('booking');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));if(new Date(x.end)<=new Date(x.start))return alert('Дата выезда должна быть позже заезда');data.bookings.push({...x,id:crypto.randomUUID(),propertyId:chosen,rate:+x.rate,commission:+x.commission});save()};f=el('expense');if(f)f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));data.expenses.push({...x,id:crypto.randomUUID(),propertyId:chosen,amount:+x.amount});save()};document.querySelectorAll('[data-delb]').forEach(b=>b.onclick=()=>{data.bookings=data.bookings.filter(x=>x.id!==b.dataset.delb);save()});document.querySelectorAll('[data-dele]').forEach(b=>b.onclick=()=>{data.expenses=data.expenses.filter(x=>x.id!==b.dataset.dele);save()});document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{data.forecast[i.dataset.f]=Math.max(0,+i.value);save()})}
el('property').onchange=e=>{chosen=e.target.value;render()};el('add').onclick=()=>{let name=prompt('Название тестового объекта');if(!name?.trim())return;let id=crypto.randomUUID();data.properties.push({id,name:name.trim()});chosen=id;save()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});el('export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='cl-finance-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};render();</script></html>
